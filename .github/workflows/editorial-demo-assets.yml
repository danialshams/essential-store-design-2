name: Prepare luxury editorial demo photography
on:
  push:
    branches: [feature/editorial-luxury-homepage-20261104]
    paths: [.github/workflows/editorial-demo-assets.yml, scripts/fetch-editorial-images.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install pillow requests --quiet
      - name: Download and optimize licensed demo editorial images
        run: python scripts/fetch-editorial-images.py
      - name: Commit image assets to experimental branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial
          if ! git diff --cached --quiet; then
            git commit -m "assets: add high-resolution optimized editorial demo photography"
            git push origin HEAD:feature/editorial-luxury-homepage-20261104
          fi
      - name: Upload photo manifest and samples
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-demo-asset-report
          path: |
            public/images/editorial/manifest.json
            public/images/editorial/*.webp
          retention-days: 3
