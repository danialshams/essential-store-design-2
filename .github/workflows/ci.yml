name: Essential Store Next.js CI
on:
  push:
  pull_request:
concurrency:
  group: editorial-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source tests
        run: npm test
      - name: Browser QA script syntax
        run: node --check scripts/verify-editorial-motion.cjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
