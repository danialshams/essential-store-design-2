name: Luxury demo product photographs
on:
  push:
    branches: [feature/editorial-cinematic-sitewide-20261104]
    paths: [.github/workflows/luxury-product-photos.yml, scripts/fetch-product-demo-images.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edition2-luxury-product-photos
  cancel-in-progress: true
jobs:
  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editorial-cinematic-sitewide-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare photo optimizer
        run: python -m pip install -q pillow requests
      - name: Download and validate free-licensed demo product photographs
        run: python scripts/fetch-product-demo-images.py
      - name: Commit only validated photographs to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/products
          if ! git diff --cached --quiet; then
            git commit -m "assets: eight editorial product demo photographs (licensed, verified)"
            git pull --rebase origin feature/editorial-cinematic-sitewide-20261104
            git push origin HEAD:feature/editorial-cinematic-sitewide-20261104
          fi
      - name: Preserve photo diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luxury-product-photo-verification
          path: |
            public/images/products/*.webp
            public/images/products/manifest.json
          retention-days: 3
